[project]
name = "ai-productivity-app"
version = "1.0.0"
description = "AI-powered productivity app with report writing, code generation, document creation, and more"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.50.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
